site_name: Saleem's Life Hacks
site_url: https://saleem.net/life-hacks/
repo_url: https://github.com/saleemh/life-hacks
theme:
  name: material
  features:
    - navigation.instant
    - navigation.tracking
    - search.suggest
    - search.highlight
  palette:
    - scheme: default
      primary: white
      accent: black
markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - tables
  - toc:
      permalink: true
extra_css:
  - stylesheets/extra.css
plugins:
  - search
# nav:
#   - Home: index.md
docs_dir: docs
site_dir: site
use_directory_urls: true
